name: Interview readiness post-merge CI

# The owner requested a workflow_dispatch run after merging this particular handoff.
# No PR code is checked out or executed by this workflow.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'codex/interview-readiness-d044' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Run all three OS matrices on merged main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref main
