[project]
name = "mokuhyo-tools"
version = "0.0.1"
description = "Reproducible content-pack builders, item QA and model prep for Mokuhyo (see BRIEF.md §7)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
assets = ["pillow>=12.0.0"]
