			shellScript = "# Embeds llama.framework / whisper.framework (dynamic, from tools/models/fetch_ios_frameworks.sh) for the SDK being built.\n# They're linked only when present (Swift autolinks them via `#if canImport`), so a checkout without them still builds.\n# The pinned llama.xcframework has no iOS Simulator slice, so the simulator gets whisper only.\nFW=\"$SRCROOT/Frameworks\"\nDEST=\"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH\"\nif [ \"$PLATFORM_NAME\" = \"iphoneos\" ]; then\n  SLICES=\"llama.xcframework/ios-arm64/llama.framework whisper.xcframework/ios-arm64/whisper.framework\"\nelse\n  SLICES=\"whisper.xcframework/ios-arm64_x86_64-simulator/whisper.framework\"\nfi\nmkdir -p \"$DEST\"\nfor rel in $SLICES; do\n  src=\"$FW/$rel\"\n  [ -d \"$src\" ] || { echo \"note: $rel not found (run tools/models/fetch_ios_frameworks.sh)\"; continue; }\n  name=\"$(basename \"$src\")\"\n  rm -rf \"$DEST/$name\"\n  cp -R \"$src\" \"$DEST/\"\n  rm -rf \"$DEST/$name/Headers\" \"$DEST/$name/Modules\"\n  if [ -n \"$EXPANDED_CODE_SIGN_IDENTITY\" ] && [ \"$CODE_SIGNING_ALLOWED\" != \"NO\" ]; then\n    codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" --preserve-metadata=identifier,entitlements \"$DEST/$name\"\n  fi\ndone\nexit 0\n";
